name: AcmeBank
options:
  bundleIdPrefix: com.acmebank
  deploymentTarget:
    iOS: "17.0"
packages:
  okta-mobile-swift:
    url: https://github.com/okta/okta-mobile-swift
    from: 2.0.0
targets:
  AcmeBank:
    type: application
    platform: iOS
    sources:
      - path: AcmeBank
    resources:
      - AcmeBank/Resources
    dependencies:
      - package: okta-mobile-swift
        product: OktaDirectAuth
    preBuildScripts:
      - name: Inject Okta Config
        script: 'bash "$SRCROOT/Scripts/inject_okta_config.sh"'
        inputFiles:
          - $(SRCROOT)/Scripts/inject_okta_config.sh
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.acmebank.mobile
        SWIFT_VERSION: "5.10"
        INFOPLIST_FILE: AcmeBank/Info.plist
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        CODE_SIGN_ENTITLEMENTS: AcmeBank/AcmeBank.entitlements
  AcmeBankTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AcmeBankTests]
    dependencies:
      - target: AcmeBank
  AcmeBankUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AcmeBankUITests]
    dependencies:
      - target: AcmeBank
schemes:
  AcmeBank:
    build:
      targets: { AcmeBank: all }
    test:
      parallelizable: false
      targets:
        - name: AcmeBankTests
        - name: AcmeBankUITests
